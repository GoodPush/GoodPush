# Developer environment for Windows. macOS / Linux: environment.yml.
#   conda env create -f environment-windows.yml        (from this folder; update: conda env update -f environment-windows.yml)
#
# As environment.yml, except jax / jaxlib / numpyro come from pip: conda-forge has no Windows jaxlib, while pip
# has Windows wheels. The ANT+ stick also needs its WinUSB driver once (Zadig, see README).
name: goodpush
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # core
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - pyarrow>=12
  - h5py>=3.8
  # physio (jax, numpyro: pip, below)
  - numba>=0.60
  # sync (goodpush peer)
  - cryptography>=42
  - paramiko>=3.4
  # dev
  - pytest>=7
  - pip:
      - -e .[all,dev]
