# Developer environment for macOS (Intel and Apple Silicon) and Linux. Windows: environment-windows.yml.
#   conda env create -f environment.yml        (from this folder; update: conda env update -f environment.yml)
#
# conda-forge: everything compiled. Its builds exist for every platform (pip has no recent wheels for Intel
# Macs: cryptography then tries to compile against OpenSSL and fails, jax stops at 0.4.38, numba is old) and
# they share one OpenSSL and one BLAS.
# pip: goodpush itself (editable) and what conda-forge lacks or packages differently - openant, pyusb,
# libusb-package (bundles libusb), PySide6-Essentials (the overlay; conda-forge only has the full, older
# PySide6), garminconnect, curl_cffi. pip sees the conda packages as installed and leaves them alone.
name: goodpush
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # core
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - pyarrow>=12
  - h5py>=3.8
  # physio
  - jax>=0.4.30
  - jaxlib>=0.4.30
  - numpyro>=0.15
  - numba>=0.60
  # sync (goodpush peer)
  - cryptography>=42
  - paramiko>=3.4
  # dev
  - pytest>=7
  - pip:
      - -e .[all,dev]
